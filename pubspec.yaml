name: civil_calc
description: UMAR Town Planner - Civil Engineering & Town Planning Calculator
version: 1.0.0
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter: {sdk: flutter}
  pdf: ^3.11.0
  printing: ^5.13.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
